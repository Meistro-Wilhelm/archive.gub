<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARCHIVE.GUB</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="archive-page">
  <div class="menu-bar">
    <div class="menu-left">
      <a href="index.html">GÜB</a>
      <a href="dashboard.html">ARCHIVE.GUB</a>
    </div>
    <div class="menu-right">
      <span class="user-info" id="user-info"></span>
      <button class="logout-btn" id="logout-btn">LOGOUT</button>
      <span class="toggle-label">LIGHT</span>
      <label class="theme-toggle">
        <input type="checkbox" id="theme-switch">
        <span class="toggle-slider"></span>
      </label>
      <span class="toggle-label">DARK</span>
    </div>
  </div>

  <div class="site-header">
    <img src="images/anti-gub.png" alt="GÜB" class="header-logo">
    <div class="site-title">ARCHIVE.GUB</div>
  </div>

  <div class="dashboard-container">
    <input type="text" class="search-bar" id="search-bar" placeholder="SEARCH DOCUMENTS..." autocomplete="off" spellcheck="false">
    <div class="level-filter">
      <label>VIEWING:</label>
      <select id="level-filter">
        <option value="all">ALL AVAILABLE LEVELS</option>
      </select>
    </div>
    <div id="doc-list-container"></div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
