<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARCHIVE.GUB</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- Menu Bar -->
  <div class="menu-bar">
    <div class="menu-left">
      <a href="/">GÜB</a>
      <a href="/dashboard">ARCHIVE</a>
    </div>
    <div class="menu-right">
      <span class="user-info" id="user-info"></span>
      <button class="logout-btn" id="logout-btn">LOGOUT</button>
      <span class="toggle-label">LIGHT</span>
      <label class="theme-toggle">
        <input type="checkbox" id="theme-switch">
        <span class="toggle-slider"></span>
      </label>
      <span class="toggle-label">DARK</span>
    </div>
  </div>

  <!-- Header -->
  <div class="site-header">
    <div class="logo-placeholder">IMAGE<br>PLACEHOLDER</div>
    <div class="site-title">ARCHIVE.GUB</div>
  </div>

  <!-- Dashboard -->
  <div class="dashboard-container">
    <!-- Search -->
    <input type="text" class="search-bar" id="search-bar" placeholder="SEARCH DOCUMENTS..." autocomplete="off" spellcheck="false">

    <!-- Level Filter -->
    <div class="level-filter">
      <label>VIEWING:</label>
      <select id="level-filter">
        <option value="all">ALL AVAILABLE LEVELS</option>
      </select>
    </div>

    <!-- Document List -->
    <div id="doc-list-container"></div>
  </div>

  <script src="/js/dashboard.js"></script>
</body>
</html>
